[project]
name = "sellerboard-amazon-sales-data"
version = "1.0.0"
description = "Sellerboard P&L export (last 30 days, by day) -> powerbidb.combined_transposed_file_US / _CA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"  # no .pytest_cache folder; run tests with `python -B` for no __pycache__
